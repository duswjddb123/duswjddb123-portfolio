<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="프론트엔드 개발자 · UI/UX 디자이너 유정연의 포트폴리오">
  <title>유정연 | 포트폴리오</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
    <span class="grain"></span>
  </div>

  <header class="site-header" id="top">
    <a class="logo" href="#hero">유정연<span class="logo-mark">.</span></a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span class="nav-toggle-bars" aria-hidden="true"></span>
      <span class="visually-hidden">메뉴</span>
    </button>
    <nav id="site-nav" class="site-nav">
      <a href="#hero">Home</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section id="hero" class="hero">
      <p class="eyebrow">Portfolio</p>
      <h1>안녕하세요!<br>저는 <em>유정연</em>입니다.</h1>
      <p class="role">프론트엔드 개발자 · UI/UX 디자이너</p>
      <a class="hero-link" href="#projects">프로젝트 보기</a>
    </section>

    <section id="projects" class="projects">
      <div class="section-head">
        <p class="eyebrow">Selected work</p>
        <h2>프로젝트</h2>
      </div>
      <div class="project-cards">
        <article class="card">
          <div class="card-media">
            <img src="https://images.unsplash.com/photo-1461749280684-dccba630e2f6?auto=format&fit=crop&w=900&q=80" alt="코드 에디터 화면이 보이는 웹 개발 작업" width="900" height="600">
            <span class="card-index">01</span>
          </div>
          <h3>프로젝트 1</h3>
          <p>React 기반 웹앱 개발</p>
        </article>
        <article class="card">
          <div class="card-media">
            <img src="https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&w=900&q=80" alt="함께 화면을 보며 작업하는 팀" width="900" height="600">
            <span class="card-index">02</span>
          </div>
          <h3>프로젝트 2</h3>
          <p>반응형 포트폴리오 사이트</p>
        </article>
        <article class="card">
          <div class="card-media">
            <img src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=900&q=80" alt="노트북 위에서 진행 중인 디자인 작업" width="900" height="600">
            <span class="card-index">03</span>
          </div>
          <h3>프로젝트 3</h3>
          <p>UI/UX 디자인 시스템 구축</p>
        </article>
      </div>
    </section>

    <section id="contact" class="contact">
      <div class="contact-panel">
        <div class="section-head">
          <p class="eyebrow">Say hello</p>
          <h2>Contact</h2>
        </div>
        <form id="contactForm">
          <label>
            <span>이름</span>
            <input type="text" name="name" placeholder="이름을 입력해 주세요" autocomplete="name" required>
          </label>
          <label>
            <span>이메일</span>
            <input type="email" name="email" placeholder="hello@email.com" autocomplete="email" required>
          </label>
          <label>
            <span>메시지</span>
            <textarea name="message" placeholder="무엇을 함께 만들고 싶으신가요?" rows="5" required></textarea>
          </label>
          <button type="submit">보내기</button>
        </form>
        <p id="formMessage" role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 유정연. All rights reserved.</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
